# Kitty terminal configuration — Catppuccin Mocha, see-through + blurred

# Font
font_family       ComicShannsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         22

# Spacing
modify_font cell_height 150%

# Shell
shell /usr/bin/fish

# Window
window_padding_width 21
hide_window_decorations yes 
confirm_os_window_close 3

# Transparency & blur
background_opacity 1.5
background_blur 13
dynamic_background_opacity no 

# Cursor
cursor_shape        beam 
cursor_blink_interval 3.5

# Scrollback
scrollback_lines 10003

# Tab bar
tab_bar_style powerline
tab_bar_edge bottom
tab_bar_margin_width 3.0
tab_bar_margin_height 3.0 3.0
tab_bar_min_tabs 1
tab_powerline_style slanted
tab_title_template "{index}: {title}"
tab_title_max_length 22
tab_bar_align left

# Splits and window management
enabled_layouts splits,stack
map ctrl+h launch --location=vsplit --cwd=current
map ctrl+shift+h launch --location=hsplit --cwd=current
map ctrl+grave next_window
map ctrl+shift+t new_tab_with_cwd
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+space select_tab

# Themes
map ctrl+shift+f12 launch --type=background ~/.config/kitty/kt

# Mouse
mouse_hide_wait 5.0

include lunar-mono.conf
include current-theme.conf

include noir.conf
