<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 220px; margin: 12px; background: #1c1c1e; color: #eee; }
      p { margin: 0 0 10px; }
      button { display: block; width: 100%; margin-top: 6px; padding: 7px; border: 0; border-radius: 6px; cursor: pointer; font: inherit; }
      #close { background: #d9534f; color: #fff; }
      #ungroup { background: #3a3a3c; color: #eee; }
      button:disabled { opacity: 0.4; cursor: default; }
    </style>
  </head>
  <body>
    <p id="status">Counting...</p>
    <button id="close">Close all tabs</button>
    <button id="ungroup">Ungroup (keep tabs)</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
