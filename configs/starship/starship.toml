# generated by `dotfiles prompt pocket` — edit configs/starship/prompts/pocket.toml instead

# ghostty-opacity = 0.9
# generated from the wallpaper by configs/kde/pocket/recolor, edit configs/kde/pocket/matugen/templates/starship.toml instead
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 800

palette = "pocket"

format = """
[ ](bg:accent)[$directory](bg:accent fg:ink)[](fg:accent bg:surface)$git_branch$git_status[](fg:surface) $cmd_duration
$character"""

[palettes.pocket]
ink     = "#3c2f00"
surface = "#2d2a21"
accent  = "#e1c46d"
text    = "#e9e2d4"
muted   = "#979080"
gold    = "#accfaf"
red     = "#ffb59f"

[directory]
home_symbol = "~"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
style = "bg:accent fg:ink bold"
format = "[$path$read_only ]($style)"

[git_branch]
symbol = " "
style = "bg:surface fg:accent"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:surface fg:gold"
format = "[$all_status$ahead_behind ]($style)"

[cmd_duration]
min_time = 500
format = "[󰔟 $duration](fg:muted)"

[character]
success_symbol = "[❯](fg:accent)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:gold)"
