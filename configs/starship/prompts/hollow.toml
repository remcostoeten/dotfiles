# ghostty-opacity = 1
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 800

palette = "hollow"

format = """
$directory$git_branch$git_status$git_state$nodejs$bun$deno$rust$golang$python$php$docker_context$cmd_duration
$character"""

right_format = "$jobs$status$time"

[palettes.hollow]
text   = "#d2c7a9"
soft   = "#af9a91"
muted  = "#4e4b61"
ember  = "#f66813"
amber  = "#b55600"
gold   = "#d6b04e"
teal   = "#8faea9"
frost  = "#a4dce7"
violet = "#8086ef"
rose   = "#e2c2bb"
red    = "#d9443f"

[directory]
style = "fg:text bold"
read_only_style = "fg:red"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " 󰌾"
home_symbol = "~"

[git_branch]
symbol = " "
style = "fg:ember"
format = "  [$symbol$branch]($style)"

[git_status]
style = "fg:soft"
format = "([ $conflicted$staged$modified$renamed$deleted$untracked$stashed$ahead_behind]($style))"
conflicted = "[=$count ](red)"
staged = "[+$count ](teal)"
modified = "[±$count ](gold)"
renamed = "[»$count ](violet)"
deleted = "[-$count ](red)"
untracked = "[?$count ](muted)"
stashed = "[≡$count ](frost)"
ahead = "[⇡$count ](teal)"
behind = "[⇣$count ](rose)"
diverged = "[⇡$ahead_count⇣$behind_count ](amber)"
up_to_date = ""

[git_state]
style = "fg:amber bold"
format = " [$state( $progress_current/$progress_total)]($style)"
rebase = "rebasing"
merge = "merging"
cherry_pick = "picking"

[nodejs]
symbol = " "
style = "fg:teal"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[bun]
symbol = " "
style = "fg:rose"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[deno]
symbol = " "
style = "fg:text"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[rust]
symbol = " "
style = "fg:amber"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[golang]
symbol = " "
style = "fg:frost"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[python]
symbol = " "
style = "fg:gold"
format = "  [$symbol($version)( \\($virtualenv\\))]($style)"
version_format = "${major}.${minor}"

[php]
symbol = " "
style = "fg:violet"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[docker_context]
symbol = " "
style = "fg:frost"
format = "  [$symbol$context]($style)"
only_with_files = true

[cmd_duration]
min_time = 2_000
style = "fg:muted"
format = "  [took $duration]($style)"

[jobs]
symbol = "✦"
style = "fg:amber"
format = "[$symbol$number]($style) "

[status]
disabled = false
symbol = "✘ "
style = "fg:red"
format = "[$symbol$status]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:muted"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold ember)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold teal)"
vimcmd_replace_one_symbol = "[❮](bold gold)"
vimcmd_replace_symbol = "[❮](bold gold)"
vimcmd_visual_symbol = "[❮](bold violet)"
