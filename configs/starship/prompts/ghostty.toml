# ghostty-opacity = 0.95
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 800

format = """
$cmd_duration$directory$git_branch$git_status
[●](fg:purple) $character"""

[cmd_duration]
min_time = 0
show_milliseconds = false
format = "[](fg:purple)[◐ $duration](bg:purple fg:black)[](fg:purple) "

[directory]
home_symbol = "⌂"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
format = "[](fg:bright-white)[ → $path$read_only](bg:bright-white fg:black)[](fg:bright-white) "

[git_branch]
symbol = " "
format = "[](fg:bright-blue)[$symbol$branch](bg:bright-blue fg:black)[](fg:bright-blue) "

[git_status]
format = "[$all_status$ahead_behind](fg:bright-black) "

[character]
success_symbol = "[▶](bold fg:bright-purple)"
error_symbol = "[▶](bold fg:bright-red)"
vimcmd_symbol = "[◀](bold fg:bright-purple)"
