# ghostty-opacity = 0.9
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 800

palette = "capsule"

format = """
[](fg:ember)$os$directory[](fg:ember)\
$git_branch$git_status$git_state\
$nodejs$bun$deno$rust$golang$python$php$docker_context\
$cmd_duration
$character"""

right_format = "$jobs$status$time"

[palettes.capsule]
ink     = "#1a100a"
ember   = "#f66813"
surface = "#262124"
text    = "#d2c7a9"
soft    = "#af9a91"
muted   = "#5d5866"
gold    = "#d6b04e"
teal    = "#8faea9"
frost   = "#a4dce7"
violet  = "#8086ef"
rose    = "#e2c2bb"
red     = "#d9443f"

[os]
disabled = false
style = "bg:ember fg:ink"
format = "[$symbol ]($style)"

[os.symbols]
Arch = ""
Linux = ""
Macos = ""

[directory]
style = "bg:ember fg:ink bold"
read_only_style = "bg:ember fg:ink"
format = "[$path]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "
home_symbol = "~"

[directory.substitutions]
"~/.config/dotfiles" = "dotfiles"

[git_branch]
symbol = " "
style = "bg:surface fg:text"
format = " [](fg:surface)[$symbol$branch]($style)"

[git_status]
style = "bg:surface fg:soft"
format = "([$all_status$ahead_behind]($style))[](fg:surface)"
conflicted = "[ =$count](bg:surface fg:red)"
staged = "[ +$count](bg:surface fg:teal)"
modified = "[ ~$count](bg:surface fg:gold)"
renamed = "[ »$count](bg:surface fg:violet)"
deleted = "[ -$count](bg:surface fg:red)"
untracked = "[ ?$count](bg:surface fg:muted)"
stashed = "[ ≡$count](bg:surface fg:frost)"
ahead = "[ ⇡$count](bg:surface fg:teal)"
behind = "[ ⇣$count](bg:surface fg:rose)"
diverged = "[ ⇡$ahead_count⇣$behind_count](bg:surface fg:gold)"
up_to_date = ""

[git_state]
style = "fg:gold bold"
format = " [$state( $progress_current/$progress_total)]($style)"

[nodejs]
symbol = " "
style = "fg:teal"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[bun]
symbol = " "
style = "fg:rose"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[deno]
symbol = " "
style = "fg:text"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[rust]
symbol = " "
style = "fg:ember"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[golang]
symbol = " "
style = "fg:frost"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[python]
symbol = " "
style = "fg:gold"
format = "  [$symbol($version)( \\($virtualenv\\))]($style)"
version_format = "${major}.${minor}"

[php]
symbol = " "
style = "fg:violet"
format = "  [$symbol$version]($style)"
version_format = "${major}.${minor}"

[docker_context]
symbol = " "
style = "fg:frost"
format = "  [$symbol$context]($style)"
only_with_files = true

[cmd_duration]
min_time = 2_000
style = "fg:muted"
format = "  [ $duration]($style)"

[jobs]
symbol = " "
style = "fg:gold"
format = "[$symbol$number]($style)  "

[status]
disabled = false
symbol = " "
style = "fg:red"
format = "[$symbol$status]($style)  "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:muted"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold ember)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold teal)"
