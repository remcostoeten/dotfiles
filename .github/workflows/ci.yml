name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish shellcheck ripgrep

      - name: Lint
        run: scripts/tests/lint.sh

      - name: Tests
        run: |
          for t in setup/tests/*.sh scripts/tests/*.sh; do
            [[ "$t" == scripts/tests/lint.sh ]] && continue
            echo "== $t"
            bash "$t"
          done
