# Dotfiles Studio — what this repository deploys, and where.
#
# One block per link. `dotweave deployment --home "$HOME"` reads these and
# reports each one as deployed, diverged, in place, absent, or unobservable.
# Nothing here deploys anything: it is a declaration, and the engine only ever
# reads. Keep it in step with setup/lib/installers.sh.
#
# `repository` names what the link itself points at, not what it ultimately
# resolves to. The four editors below share one real file through
# configs/ide/all-editors, and a chain stops at the first target inside the
# repository, so naming the final configs/vscode/... path would report
# `diverged` instead (dotweave §32-O14).

[[deployment]]
deployed = "~/.agents"
repository = "configs/agents"

[[deployment]]
deployed = "~/.config/Cursor/README.md"
repository = "configs/ide/all-editors/README.md"

[[deployment]]
deployed = "~/.config/Cursor/extensions.json"
repository = "configs/ide/all-editors/extensions.json"

[[deployment]]
deployed = "~/.config/Cursor/keybindings.json"
repository = "configs/ide/all-editors/keybindings.json"

[[deployment]]
deployed = "~/.config/Cursor/settings.json"
repository = "configs/ide/all-editors/settings.json"

