# Deployed by install_keyd as a root-owned copy, outside $HOME. The engine may
# only look under the declared home, so this reports `unobservable` — which is
# the honest answer, not a clean bill of health.
[[deployment]]
deployed = "/etc/keyd/default.conf"
repository = "configs/keyd/default.conf"
