<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="phonedrop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<title>phonedrop</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
:root{--bg:#fafafa;--surface:#ffffff;--fg:#0a0a0a;--muted:#6b6b6b;--line:#d9d9d9;--accent:#fe5101;--ok:#1fae78;--warn:#b7791f;--err:#e5484d;--raised:#ffffff;--bezel:#0a0a0a;--ease-out:cubic-bezier(0.23,1,0.32,1);--ease-drawer:cubic-bezier(0.32,0.72,0,1);--sans:"Geist",ui-sans-serif,system-ui,-apple-system,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0a0a;--surface:#111111;--fg:#ededed;--muted:#8a8a8a;--line:#262626;--ok:#54f2b3;--warn:#f5b544;--raised:#262626;--bezel:#262626;--accent-text:var(--accent);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0a0a0a;--surface:#111111;--fg:#ededed;--muted:#8a8a8a;--line:#262626;--ok:#54f2b3;--warn:#f5b544;--raised:#262626;--bezel:#262626;--accent-text:var(--accent);color-scheme:dark}
:root{--fill:color-mix(in srgb,var(--fg) 5%,transparent);--fill-2:color-mix(in srgb,var(--fg) 9%,transparent);--fill-3:color-mix(in srgb,var(--fg) 15%,transparent);--surface-h:color-mix(in srgb,var(--surface),var(--fg) 4%);--surface-f:color-mix(in srgb,var(--surface),var(--fg) 9%);--accent-soft:color-mix(in srgb,var(--accent) 11%,transparent);--accent-fill:color-mix(in srgb,var(--accent) 22%,transparent);--accent-h:color-mix(in srgb,var(--accent),#0a0a0a 12%);--accent-f:color-mix(in srgb,var(--accent),#0a0a0a 26%);--accent-strong:color-mix(in srgb,var(--accent) 78%,#000);--accent-text:var(--accent-strong);--accent-sh:color-mix(in srgb,var(--accent-strong),#0a0a0a 14%);--accent-sf:color-mix(in srgb,var(--accent-strong),#0a0a0a 30%)}
html,body{background:color-mix(in srgb,var(--bg),var(--fg) 4%);color:var(--fg)}
body{font:400 15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;font-variant-numeric:tabular-nums}
em,i,cite,address,dfn,var{font-style:normal}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:var(--accent-text);text-decoration:none}
a:hover{text-decoration:underline}
:focus,:focus-visible{outline:none}
[hidden]{display:none!important}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}.i.xs{width:14px;height:14px}.i.lg{width:24px;height:24px;stroke-width:2}.i.b3{stroke-width:3}.i.fill{fill:currentColor;stroke:none}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}

.btn{height:40px;padding:0 14px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;font-size:14px;background:var(--fill);white-space:nowrap;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
a.btn{color:var(--fg);text-decoration:none}
.btn:focus-visible{background:var(--fill-3)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-strong);color:#fff}
.btn.primary:focus-visible{background:var(--accent-sf)}
.btn.ghost{background:transparent}
.btn.ghost:focus-visible{background:var(--fill-2)}
.btn.danger{color:var(--err);background:color-mix(in srgb,var(--err) 10%,transparent)}
.btn.danger:focus-visible{background:color-mix(in srgb,var(--err) 22%,transparent)}
.btn.armed,.btn.danger.armed{background:var(--err);color:#fff}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.lg{height:48px;font-size:15px;border-radius:10px}
.btn[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-text)}
.icon-btn{width:40px;height:40px;border-radius:999px;display:inline-grid;place-items:center;color:var(--fg);flex:none;transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease-out)}
.icon-btn.sm{width:32px;height:32px}
.icon-btn:focus-visible{background:var(--fill-3)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.armed{background:var(--err);color:#fff}
.plain{height:40px;padding:0 6px;font-weight:500;color:var(--accent-text);border-radius:6px;transition:background-color 150ms ease}
.plain:focus-visible{background:var(--accent-soft)}
.kbd{font:500 11.5px var(--mono);padding:2px 6px;border-radius:5px;background:var(--fill-2);color:var(--muted);white-space:nowrap}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--fill-2)}.btn.primary:hover{background:var(--accent-sh)}.btn.ghost:hover{background:var(--fill)}
  .btn.danger:hover{background:color-mix(in srgb,var(--err) 16%,transparent)}.btn.armed:hover{background:var(--err)}
  .btn[aria-pressed=true]:hover{background:var(--accent-fill)}
  .icon-btn:hover{background:var(--fill-2)}.icon-btn.armed:hover{background:var(--err)}.plain:hover{background:var(--accent-soft)}
}



.p-main{flex:1;min-height:0;display:flex;flex-direction:column}
.p-head{padding:2px 20px 0;flex:none}
.p-top{display:flex;align-items:center;justify-content:space-between;height:44px;gap:8px}
.p-top strong{font-weight:600}
.conn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:500;transition:background-color 150ms ease}
button.conn:focus-visible{background:var(--fill-3)}
@media (hover:hover) and (pointer:fine){button.conn:hover{background:var(--fill-2)}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--warn)}.dot.none{background:var(--muted)}
.p-title{display:flex;align-items:center;gap:10px;margin:6px 0 14px;min-height:40px}
.p-title h1{font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1}
.p-title .cnt{font:400 13px var(--mono);color:var(--muted);margin-top:6px}
.p-title .sp{flex:1}
.back{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 8px 0 2px;margin-left:-6px;border-radius:6px;color:var(--accent-text);font-weight:500;transition:background-color 150ms ease}
.back:focus-visible{background:var(--accent-soft)}
@media (hover:hover) and (pointer:fine){.back:hover{background:var(--accent-soft)}}
.seg{display:flex;padding:3px;border-radius:9px;background:var(--fill);gap:2px}
.seg button{flex:1;height:34px;padding:0 10px;border-radius:7px;font-weight:500;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;transition:background-color 150ms ease,color 150ms ease}
.seg button .n{font:400 12px var(--mono);color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--fg);box-shadow:0 1px 2px rgba(10,10,10,.08)}
.seg button:focus-visible{background:var(--fill-2);color:var(--fg)}
.seg button[aria-pressed=true]:focus-visible{background:var(--raised);color:var(--accent-text)}
.seg.sm button{height:30px;font-size:13px;padding:0 9px}
@media (hover:hover) and (pointer:fine){.seg button:hover{color:var(--fg)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 20px 4px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 12px;border-radius:999px;background:var(--fill);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;white-space:nowrap;flex:none;transition:background-color 150ms ease,color 150ms ease}
.chip .sw{width:8px;height:8px;border-radius:50%}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.chip:focus-visible{background:var(--fill-3)}
.chip[aria-pressed=true]:focus-visible{background:color-mix(in srgb,var(--fg) 78%,var(--bg))}
.chip.add{color:var(--muted)}
@media (hover:hover) and (pointer:fine){.chip:not([aria-pressed=true]):hover{background:var(--fill-2)}}
.p-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:160px;scrollbar-width:none}
.p-scroll::-webkit-scrollbar{display:none}

.folders{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 2px;scrollbar-width:none}
.folders::-webkit-scrollbar{display:none}
.ftile{flex:none;width:122px;padding:12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:20px;text-align:left;transition:background-color 150ms ease,transform 160ms var(--ease-out)}
.ftile .i{color:var(--muted)}
.ftile b{font-weight:500;font-size:14px;display:block}
.ftile small{font:400 12px var(--mono);color:var(--muted)}
.ftile:focus-visible{background:var(--surface-f)}
.ftile:active{transform:scale(.97)}
.ftile.new{background:var(--fill);border-color:transparent;justify-content:space-between}
.ftile.new:focus-visible{background:var(--fill-3)}
.selecting .ftile:not(.new){background:var(--accent-soft)}
@media (hover:hover) and (pointer:fine){.ftile:hover{background:var(--surface-h)}.ftile.new:hover{background:var(--fill-2)}}

.day{padding:20px 20px 0}
.day-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.day-h h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.day-h span{font:400 12px var(--mono);color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1;border-radius:10px;display:block;width:100%;background:transparent;transition:background-color 150ms ease;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cell .art{position:absolute;inset:0;border-radius:8px;transition:transform 220ms var(--ease-out)}
.cell .dur{position:absolute;right:6px;bottom:6px;display:flex;align-items:center;gap:3px;font:500 11.5px var(--mono);color:#fff;background:rgba(10,10,10,.55);padding:2px 7px 2px 5px;border-radius:999px}
.cell .src{position:absolute;left:6px;bottom:6px;font:500 10.5px var(--mono);color:#fff;background:rgba(10,10,10,.55);padding:2px 6px;border-radius:999px}
.cell .check{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:transparent;background:rgba(10,10,10,.28);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.95);opacity:0;transform:scale(.9);transition:opacity 150ms ease,transform 160ms var(--ease-out),background-color 150ms ease}
.selecting .cell .check{opacity:1;transform:none}
.cell.sel .check{opacity:1;transform:none;background:var(--accent-strong);color:#fff;box-shadow:none}
.cell.sel{background:var(--accent-fill)}
.cell.sel .art{transform:scale(.86)}
.cell:focus-visible,.cell.cur{background:var(--fill-3)}
.cell:focus-visible .art,.cell.cur .art{transform:scale(.9)}
.cell.sel.cur,.cell.sel:focus-visible{background:var(--accent-fill)}
@media (hover:hover) and (pointer:fine){.cell:hover{background:var(--fill-2)}.cell:hover .art{transform:scale(.94)}.cell.sel:hover .art{transform:scale(.86)}.desk .cell:hover .check{opacity:1;transform:none}}

.art{background:var(--fill-2)}

.tcards{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mgrid+.tcards{margin-top:10px}
.swipe{position:relative;border-radius:10px;overflow:hidden}
.swipe-under{position:absolute;inset:0;display:none;align-items:center;justify-content:flex-end;gap:8px;padding-right:20px;background:var(--err);color:#fff;font-weight:500;font-size:14px}
.swipe.swiping .swipe-under{display:flex}
.card{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px 8px 14px;cursor:pointer;touch-action:pan-y;transition:background-color 150ms ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card .kind{display:flex;align-items:center;gap:6px;font:400 12px var(--mono);color:var(--muted)}
.card .kind .sp{flex:1}
.card .body{margin-top:6px;font-size:15px;line-height:1.45;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;padding-right:4px}
.card.k-code .body{font:500 20px/1.3 var(--mono);letter-spacing:.04em}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
.card.k-link .body{font-weight:500}
.card .url{font:400 12.5px var(--mono);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .foot{display:flex;align-items:center;gap:6px;margin-top:8px;min-height:32px}
.card .foot .labels{flex:1;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-width:0}
.card.sel{background:var(--accent-soft)}
.card:focus-visible,.card.cur{background:var(--surface-f)}
.card.sel.cur,.card.sel:focus-visible{background:var(--accent-fill)}
.card .check{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--surface)}
.selecting .card .check,.card.sel .check{display:grid}
.card.sel .check{background:var(--accent-strong);color:#fff;box-shadow:none}
.selecting .card .kind .from,.card.sel .kind .from{visibility:hidden}
@media (hover:hover) and (pointer:fine){.card:not(.sel):hover{background:var(--surface-h)}}
.frow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);cursor:pointer;touch-action:pan-y;transition:background-color 150ms ease;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ftype{width:44px;height:44px;border-radius:7px;background:var(--fill-2);display:grid;place-items:center;font:500 10.5px var(--mono);color:var(--muted);flex:none;letter-spacing:.03em}
.ftype.pdf{background:color-mix(in srgb,#e5484d 14%,transparent);color:#e5484d}
.frow .meta{flex:1;min-width:0}
.frow .meta b{display:block;font-weight:500;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .meta small{font:400 12px var(--mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.frow .check{width:22px;height:22px;border-radius:50%;display:none;place-items:center;color:transparent;box-shadow:inset 0 0 0 1.5px var(--line);flex:none;margin-left:4px}
.selecting .frow .check,.frow.sel .check{display:grid}
.selecting .frow .icon-btn{display:none}
.frow.sel .check{background:var(--accent-strong);color:#fff;box-shadow:none}
.frow.sel{background:var(--accent-soft)}
.frow:focus-visible,.frow.cur{background:var(--surface-f)}
.frow.sel.cur,.frow.sel:focus-visible{background:var(--accent-fill)}
@media (hover:hover) and (pointer:fine){.frow:not(.sel):hover{background:var(--surface-h)}}
.files{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lbl{--c:#8a8a8a;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font:500 11.5px var(--sans);background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--fg));white-space:nowrap}
.lbl::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.time{font:400 12px var(--mono);color:var(--muted);white-space:nowrap}

.cell.arrived{animation:arrive 2600ms ease-out}
.cell.arrived .art{animation:pop 340ms var(--ease-out)}
@keyframes arrive{0%,30%{background-color:var(--accent-fill)}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card.arrived,.frow.arrived{animation:arriveCard 2600ms ease-out}
@keyframes arriveCard{0%{background-color:var(--accent-fill);transform:translateY(-6px);opacity:0}9%{transform:none;opacity:1}30%{background-color:var(--accent-fill)}}

.dock{position:absolute;left:0;right:0;bottom:0;padding:16px 12px 28px;background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent));z-index:20}
.uploads{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.uploads:empty{display:none}
.up{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13px;transition:opacity 240ms var(--ease-out),transform 240ms var(--ease-out)}
@starting-style{.up{opacity:0;transform:translateY(8px)}}
.up .thumb{width:36px;height:36px;border-radius:7px;flex:none}
.up .u-main{flex:1;min-width:0}
.up .u-row{display:flex;justify-content:space-between;gap:8px}
.up .u-row b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up .u-row span{font:400 12px var(--mono);color:var(--muted);flex:none}
.bar{height:4px;border-radius:999px;background:var(--fill-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform 160ms linear}
.up.failed .bar i{background:var(--err)}
.up.failed .u-row span{color:var(--err)}
.composer{display:flex;align-items:flex-end;gap:8px}
.cbox{flex:1;min-width:0;display:flex;align-items:center;min-height:54px;border-radius:27px;background:var(--surface);border:1px solid var(--line);padding:0 6px 0 18px;transition:background-color 150ms ease}
.cbox:focus-within{background:var(--surface-h)}
.cbox input{flex:1;min-width:0;border:0;background:none;font-size:16px;height:52px}
.cbox input::placeholder,.dcomp input::placeholder,.search input::placeholder{color:var(--muted)}
.send{flex:none;width:40px;height:40px;border-radius:999px;background:var(--fg);color:var(--bg);display:grid;place-items:center;opacity:0;transform:scale(.85);pointer-events:none;transition:opacity 150ms ease,transform 180ms var(--ease-out),background-color 150ms ease}
.paste{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--fill-2);font-size:14px;font-weight:500;flex:none;transition:background-color 150ms ease,transform 160ms var(--ease-out)}
.paste:active{transform:scale(.95)}
.paste .i{width:16px;height:16px}
.cbox.has .paste{display:none}
.cbox.has .send{opacity:1;transform:none;pointer-events:auto}
.send:focus-visible{background:var(--accent-strong);color:#fff}
.fab{width:54px;height:54px;border-radius:999px;background:var(--accent-strong);color:#fff;flex:none;display:grid;place-items:center;transition:background-color 150ms ease,transform 160ms var(--ease-out);box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent-strong) 70%,transparent)}
.fab .i{width:26px;height:26px;stroke-width:2.2}
.fab:focus-visible{background:var(--accent-sf)}
.fab:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.fab:hover{background:var(--accent-sh)}}
.actbar{display:none;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:18px;background:var(--fg);color:var(--bg)}
.dock.selecting .composer{display:none}
.dock.selecting .actbar{display:grid;animation:barIn 240ms var(--ease-out)}
@keyframes barIn{from{opacity:0;transform:translateY(10px)}}
.actbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:58px;border-radius:13px;font-size:11.5px;font-weight:500;transition:background-color 150ms ease,transform 160ms var(--ease-out)}
.actbar button:focus-visible{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.actbar button:active{transform:scale(.95)}
.actbar button.armed{background:var(--err);color:#fff}
.actbar button[disabled]{opacity:.35;pointer-events:none}
@media (hover:hover) and (pointer:fine){.actbar button:not(.armed):hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}}

.toasts{position:absolute;top:60px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:90}
.toasts.fixed{position:fixed;top:56px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 6px 6px 14px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;max-width:min(380px,calc(100% - 28px));box-shadow:0 14px 34px -14px rgba(10,10,10,.5);transition:opacity 240ms var(--ease-out),transform 280ms var(--ease-out)}
@starting-style{.toast{opacity:0;transform:translateY(-14px) scale(.96)}}

function pushSupported() { return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window }

function pushHint(text) { return `<div class="hint">${ic('bell')}<span>${text}</span></div>` }

function pushBody() {
  const p = S.push
  if (!p) return '<p class="muted">Checking…</p>'
  if (p.failed) return pushHint('Could not reach the PC.')
  if (!p.usable) return pushHint('The PC needs the <b>python-cryptography</b> package. Install it and restart phonedrop.')
  if (!window.isSecureContext) {
    if (!p.secure_url) return pushHint('HTTPS is off on the PC because <code>openssl</code> is missing.')
    return `<p class="muted" style="font-size:13.5px;line-height:1.5">iOS only allows notifications for a home screen app opened over HTTPS. Trust the certificate once, then add the secure page to your home screen.</p><div class="steps" style="margin-top:14px"><div class="step"><span class="num">1</span><span>Tap <b>Get certificate</b> and allow the download.</span></div><div class="step"><span class="num">2</span><span>Settings, General, <b>VPN &amp; Device Management</b>, install phonedrop local CA.</span></div><div class="step"><span class="num">3</span><span>Settings, General, About, <b>Certificate Trust Settings</b>, turn it on.</span></div><div class="step"><span class="num">4</span><span>Tap <b>Open secure page</b>, then Share and <b>Add to Home Screen</b>. Open phonedrop from there and come back to this screen.</span></div></div><div class="push-actions"><a class="btn lg" href="/ca.crt">Get certificate</a><a class="btn lg primary" href="${esc(p.secure_url)}">Open secure page</a></div>`
  }
  if (!pushSupported()) {
    if (isIOS && !navigator.standalone) return pushHint('Tap <b>Share</b>, then <b>Add to Home Screen</b>. Open phonedrop from the home screen and come back here.')
    return pushHint('This browser does not support notifications.')
  }
  if (Notification.permission === 'denied') return pushHint('Notifications are blocked. Allow them in Settings, Notifications, phonedrop.')
  if (p.on) return `<div class="push-state"><span class="dot"></span>On. This phone is told when the PC sends something.</div><div class="push-actions"><button class="btn lg" data-act="push-test"${S.pushBusy ? ' disabled' : ''}>Send test</button><button class="btn lg" data-act="push-off"${S.pushBusy ? ' disabled' : ''}>Turn off</button></div>`
  return `<p class="muted" style="font-size:13.5px;line-height:1.5">Get a notification when the PC sends a file or text, even with phonedrop closed.</p><div class="push-actions"><button class="btn lg primary" data-act="push-on"${S.pushBusy ? ' disabled' : ''}>Turn on notifications</button></div>`
}

  if (d.kind === 'conn') {
    const showHint = isIOS && !navigator.standalone
    return `${head('PC', S.live ? 'Connected over wifi' : 'Offline')}<div class="sh-body"><dl class="meta-l" style="margin-top:4px"><dt>Address</dt><dd class="mono">${esc(location.host)}</dd><dt>Status</dt><dd><span class="dot${S.live ? '' : ' off'}"></span>${S.live ? 'Live, items arrive instantly' : 'What you send waits for the PC'}</dd></dl>${showHint ? `<div class="hint">${ic('share')}<span>Tap <b>Share</b> in Safari, then <b>Add to Home Screen</b>. phonedrop then opens full screen, like an app.</span></div>` : ''}<a class="btn lg" style="width:100%;margin-top:16px" href="/cam">${ic('camera', 'sm')}Use this phone as a camera</a><div class="sect">Notifications</div>${pushBody()}</div>`
  }

}
function openSheet(d) {
  S.sheet = d
  const layer = $('#layer')
  const wide = d.kind === 'pair' ? ' wide' : ''
  if (layer.classList.contains('open')) {
    const sh = layer.querySelector('.sheet')

    sh.innerHTML = sheetHTML(d)
    sh.focus({ preventScroll: true })
    return
  }
  returnFocus = document.activeElement
  layer.innerHTML = `<div class="scrim" data-act="close-sheet"></div><div class="sheet${wide}" role="dialog" aria-modal="true" tabindex="-1">${sheetHTML(d)}</div>`
  layer.classList.remove('closing')
  void layer.offsetHeight
  layer.classList.add('open')
  requestAnimationFrame(() => {
    const f = layer.querySelector('input.input')
    if (f && (d.kind === 'newfolder')) f.focus({ preventScroll: true }); else layer.querySelector('.sheet').focus({ preventScroll: true })
  })
}
function refreshSheet() {
  if (!S.sheet) return
  const sh = $('#layer .sheet')
  if (!sh) return
  if (S.sheet.kind === 'detail' && !byId(S.sheet.id)) { closeSheet(); return }
  const html = sheetHTML(S.sheet)
  if (sh.dataset.html === html) return
  const typed = {}
  sh.querySelectorAll('form input[name]').forEach((input) => { typed[input.name] = input.value })
  sh.innerHTML = html
  sh.dataset.html = html
  sh.querySelectorAll('form input[name]').forEach((input) => { if (typed[input.name]) input.value = typed[input.name] })
}
async function loadPush() {
  try {
    const response = await fetch('/api/push', { cache: 'no-store' })
    if (!response.ok) throw new Error(response.status)
    const info = await response.json()
    let on = false
    if (window.isSecureContext && pushSupported()) {
      const registration = await Promise.race([navigator.serviceWorker.ready, new Promise((resolve) => setTimeout(resolve, 3000))])
      on = !!(registration && (await registration.pushManager.getSubscription()))
    }
    S.push = { ...info, on }
  } catch (error) {
    S.push = { failed: true }
  }
  refreshSheet()
}

function keyBytes(text) {
  const raw = atob(text.replace(/-/g, '+').replace(/_/g, '/'))
  return Uint8Array.from(raw, (c) => c.charCodeAt(0))
}

async function pushOn() {
  if ((await Notification.requestPermission()) !== 'granted') return
  const registration = await navigator.serviceWorker.ready
  const existing = await registration.pushManager.getSubscription()
  const sub = existing || (await registration.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(S.push.key) }))
  const response = await fetch('/api/push/subscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub.toJSON()) })
  if (!response.ok) throw new Error(`subscribe ${response.status}`)
  S.push.on = true
}

async function pushOff() {
  const registration = await navigator.serviceWorker.ready
  const sub = await registration.pushManager.getSubscription()
  if (sub) {
    await fetch('/api/push/unsubscribe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) })
    await sub.unsubscribe()
  }
  S.push.on = false
}

async function runPush(action, done) {
  S.pushBusy = true
  refreshSheet()
  try {
    await action()
    if (done) toast(done)
  } catch (error) {
    console.warn('phonedrop: push failed', error)
    toast('Notifications failed. Try again.')
  }
  S.pushBusy = false
  refreshSheet()
}

function closeSheet() {
  const layer = $('#layer')
  if (!layer.classList.contains('open')) return
  layer.classList.remove('open')
  layer.classList.add('closing')
  setTimeout(() => { if (!layer.classList.contains('open')) { layer.innerHTML = ''; layer.classList.remove('closing') } }, 240)
  S.sheet = null
  if (returnFocus && document.contains(returnFocus)) returnFocus.focus({ preventScroll: true })
}

function toast(msg, o) {
  const opts = o || {}
  const box = $('#toasts')
  const el = document.createElement('div')
  el.className = 'toast'
  el.setAttribute('role', 'status')
  const lead = opts.thumb ? `<img class="tthumb" src="${esc(opts.thumb)}" alt="">` : opts.icon ? `<span class="ticon">${ic(opts.icon, 'sm')}</span>` : ''
  el.innerHTML = `${lead}<span class="tmsg">${esc(msg)}${opts.sub ? `<small>${esc(opts.sub)}</small>` : ''}</span>${(opts.actions || []).map((a) => `<button class="tbtn" data-act="${a[0]}" data-id="${esc(a[2] || '')}">${esc(a[1])}</button>`).join('')}`
  box.prepend(el)
  while (box.children.length > 3) box.lastElementChild.remove()
  setTimeout(() => dismiss(el), opts.ms || (opts.actions ? 5200 : 3000))
}
function dismiss(el) {
  if (!el.isConnected || el.classList.contains('out')) return
  el.classList.add('out')
  setTimeout(() => el.remove(), 190)
}

function render() {
  document.body.classList.toggle('local', S.local)
  if (S.view === 'phone') renderPhone(); else renderDesk()
  refreshSheet()
  S.arriving.clear()
}
function arm(key, message) {
  S.armed = key
  clearTimeout(armTimer)
  armTimer = setTimeout(() => { S.armed = ''; render() }, 3200)
  if (message) toast(message)
  render()
}
function disarm() { S.armed = ''; clearTimeout(armTimer) }

async function call(method, url, body) {
  const response = await fetch(url, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined
  })
  if (!response.ok) throw new Error(`HTTP ${response.status}`)
  return response.json()
}
async function attempt(job, failure) {
  try {
    await job()
    return true
  } catch (error) {
    console.warn('phonedrop:', failure, error)
    toast(failure, { icon: 'x' })
    return false
  }
}

async function refresh() {
  const response = await fetch('/api/state', { cache: 'no-store' })
  if (response.status === 401) { location.reload(); return }
  if (!response.ok) throw new Error(`HTTP ${response.status}`)
  applyState(await response.json())
}
function applyState(data) {
  const sig = JSON.stringify(data)
  if (sig === lastSig) return
  lastSig = sig
  try { localStorage.setItem('phonedrop-state', sig) } catch (error) { console.warn('phonedrop: state not cached', error) }
  const known = new Set(items.map((it) => it.id))
  Object.assign(S, { files: data.files, notes: data.notes, folders: data.folders, labels: data.labels, local: data.local, presence: data.presence })
  buildItems()
  const fresh = S.loaded ? items.filter((it) => !known.has(it.id)) : []
  const incoming = fresh.filter(isIncoming)
  fresh.forEach((it) => S.arriving.add(it.id))
  S.loaded = true
  if (S.folder && !S.folders.some((f) => f.name === S.folder)) S.folder = ''

function copyText(text, message) {
  const done = () => toast(message || 'Copied', { icon: 'check' })
  const fail = () => toast('Copy failed', { icon: 'x' })
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fail); return }
  const area = document.createElement('textarea')
  area.value = text
  area.setAttribute('readonly', '')
  area.style.cssText = 'position:fixed;top:0;left:0;opacity:0'
  document.body.appendChild(area)
  area.focus()
  area.setSelectionRange(0, text.length)
  const ok = document.execCommand('copy')
  area.remove()
  if (ok) done(); else fail()
}
function copyOf(it) { return it.kind === 'code' ? it.text : it.raw }

async function fetchAsFile(it) {

async function saveToLibrary(list) {

  toast(files.length === 1 ? 'Preparing' : `Preparing ${files.length} files`, { icon: 'download' })
  try {
    const payload = await Promise.all(files.map(fetchAsFile))
    if (canShareFiles && navigator.canShare({ files: payload })) {
      await navigator.share({ files: payload })
      return true
    }
    location.href = files.length === 1 ? fileUrl(files[0].path, true) : zipUrl(files.map((it) => it.path))

  } catch (error) {

function setCursor(id, focus) {

  disarm()
  render()
  if (id && focus) {
    const el = [...$('#dFeed').querySelectorAll('[data-id]')].find((x) => x.dataset.id === id)

function moveCursor(key) {
  const els = [...$('#dFeed').querySelectorAll('[data-id]')]
  if (!els.length) return
  const cur = els.find((el) => el.dataset.id === S.cur)
  if (!cur) { setCursor(els[0].dataset.id, true); return }
  const i = els.indexOf(cur)
  let target = null
  if (key === 'ArrowRight') target = els[i + 1]
  else if (key === 'ArrowLeft') target = els[i - 1]
  else {
    const c = cur.getBoundingClientRect()
    const cx = c.left + c.width / 2
    let best = Infinity
    for (const el of els) {
      if (el === cur) continue
      const r = el.getBoundingClientRect()
      const dy = key === 'ArrowDown' ? r.top - c.bottom : c.top - r.bottom
      if (dy < -1) continue
      const score = dy * 3 + Math.abs(r.left + r.width / 2 - cx)
      if (score < best) { best = score; target = el }
    }
  }
  if (target) setCursor(target.dataset.id, true)
}

async function deleteItems(ids) {
  const list = ids.map(byId).filter(Boolean)
  if (!list.length) return
  const ok = await attempt(() => Promise.all(list.map((it) => call('DELETE', it.type === 'file' ? `/api/files/${encodePath(it.path)}` : `/api/notes/${encodeURIComponent(it.id.slice(2))}`))), 'Delete failed')
  disarm()
  ids.forEach((id) => S.sel.delete(id))
  if (ids.includes(S.cur)) S.cur = ''
  if (S.sheet && S.sheet.kind === 'detail') closeSheet()
  if (S.selecting && !S.sel.size) S.selecting = false
  await refresh()
  if (!ok) return
  const notes = list.filter((it) => it.type === 'note')
  const message = list.length === 1 ? `Deleted ${list[0].kind === 'note' ? 'note' : list[0].name}` : `Deleted ${list.length} items`
  if (notes.length === list.length) {
    seq += 1
    const key = `undo${seq}`
    undoBin.set(key, notes.map((it) => ({ text: it.raw, folder: it.folder })))
    toast(message, { icon: 'trash', actions: [['undo', 'Undo', key]], ms: 6000 })
  } else toast(message, { icon: 'trash' })
}

function upThumb(u) {
  if (u.kind === 'note') return `<span class="thumb">${ic('note', 'sm')}</span>`
  if (u.url) return `<img class="thumb" src="${u.url}" alt="">`
  return `<span class="thumb">${esc(ext(u.name))}</span>`
}
function renderUploads() {
  const html = uploads.map((u) => `<div class="up${u.status === 'failed' ? ' failed' : ''}" data-up="${u.id}">${upThumb(u)}<div class="u-main"><div class="u-row"><b>${esc(u.name)}</b><span>${u.status === 'failed' ? 'Failed · upload stopped' : u.status === 'hold' ? 'Waiting for the PC' : u.status === 'wait' ? 'Waiting' : u.kind === 'note' ? 'Sending' : `${Math.round(u.pct * 100)}% · ${size(u.size)}`}</span></div><div class="bar"><i style="transform:scaleX(${u.pct})"></i></div></div>${u.status === 'failed' ? `<button class="btn sm" data-act="retry" data-v="${u.id}">Retry</button><button class="icon-btn sm" data-act="cancel-up" data-v="${u.id}" aria-label="Dismiss">${ic('x', 'sm')}</button>` : `<button class="icon-btn sm" data-act="cancel-up" data-v="${u.id}" aria-label="Cancel upload">${ic('x', 'sm')}</button>`}</div>`).join('')
  setHTML($('#pUploads'), html)

function paintProgress(u) {
  document.querySelectorAll(`[data-up="${u.id}"]`).forEach((row) => {
    row.querySelector('.bar i').style.transform = `scaleX(${u.pct})`
    row.querySelector('.u-row span').textContent = `${Math.round(u.pct * 100)}% · ${size(u.size)}`
    delete row.parentNode.dataset.html
  })
}
function putFile(u) {
  return new Promise((resolve, reject) => {
    const request = new XMLHttpRequest()
    u.xhr = request
    request.open('PUT', `/api/upload?name=${encodeURIComponent(u.name)}&folder=${encodeURIComponent(u.folder)}`)
    request.upload.addEventListener('progress', (event) => {
      if (!event.lengthComputable) return
      u.pct = event.loaded / event.total
      paintProgress(u)
    })
    request.addEventListener('load', () => (request.status < 300 ? resolve() : reject(new Error(`HTTP ${request.status}`))))
    request.addEventListener('error', () => reject(new Error('network error')))
    request.addEventListener('abort', () => reject(new Error('cancelled')))
    request.send(u.file)
  })
}
let dbPromise = null
let resumeTimer = 0
function dbOpen() {
  dbPromise = dbPromise || new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('no indexedDB')); return }
    const request = indexedDB.open('phonedrop', 1)
    request.onupgradeneeded = () => request.result.createObjectStore('outbox', { keyPath: 'id', autoIncrement: true })
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error)
  })
  return dbPromise
}
async function outboxTx(mode, run) {
  const db = await dbOpen()
  return new Promise((resolve, reject) => {
    const request = run(db.transaction('outbox', mode).objectStore('outbox'))
    request.onsuccess = () => resolve(request.result)
    request.onerror = () => reject(request.error)
  })
}
function outboxAdd(job) { return outboxTx('readwrite', (store) => store.add(job)).catch(() => null) }
function outboxDel(id) { return id == null ? Promise.resolve() : outboxTx('readwrite', (store) => store.delete(id)).catch(() => null) }

function transient(error) { return error instanceof TypeError || error.message === 'network error' || /^HTTP 5\d\d$/.test(error.message) }
function dropUpload(u) {

}
function holdUploads() {
  uploads.forEach((u) => { if (u.status === 'wait' || u.status === 'up') { u.status = 'hold'; u.pct = 0 } })
  renderUploads()
  clearTimeout(resumeTimer)
  resumeTimer = setTimeout(resumeUploads, 15000)
}
function resumeUploads() {
  let held = false
  uploads.forEach((u) => { if (u.status === 'hold') { u.status = 'wait'; held = true } })
  if (!held) return
  renderUploads()
  pumpUploads()
}
function sendJob(u) {
  return u.kind === 'note' ? call('POST', '/api/notes', { text: u.text, folder: u.folder }) : putFile(u)
}
function queueJob(job) {
  seq += 1
  const u = { id: `u${seq}`, kind: job.kind, file: job.file, text: job.text, name: job.name, size: job.file ? job.file.size : 0, pct: 0, status: 'wait', folder: job.folder, url: job.file && job.file.type.startsWith('image/') ? URL.createObjectURL(job.file) : '' }
  u.saved = outboxAdd({ ...job, at: Date.now() }).then((id) => { u.dbId = id })
  uploads.push(u)
  return u
}
async function restoreOutbox() {
  const jobs = await outboxAll()
  jobs.forEach((job) => {
    const u = queueJob({ kind: job.kind, file: job.file, text: job.text, name: job.name, folder: job.folder })
    u.status = 'hold'
    outboxDel(job.id)
  })
  if (jobs.length) { renderUploads(); resumeUploads() }
}
async function pumpUploads() {
  if (pumping) return
  pumping = true
  for (let next = uploads.find((u) => u.status === 'wait'); next; next = uploads.find((u) => u.status === 'wait')) {
    next.status = 'up'
    renderUploads()
    try {
      await sendJob(next)
      dropUpload(next)
      sentCount += 1
    } catch (error) {
      if (error.message === 'cancelled') dropUpload(next)
      else if (transient(error)) { holdUploads(); break }
      else { console.warn('phonedrop: upload failed', error); next.status = 'failed' }
    }
    renderUploads()
  }
  pumping = false
  if (sentCount) toast(sentCount === 1 ? 'Sent' : `Sent ${sentCount} files`, { icon: 'check' })
  sentCount = 0
  const sc = feedRoot()
  if (sc) sc.scrollTop = 0
  refresh().catch((error) => console.warn('phonedrop: refresh failed', error))
}
function queueUploads(list) {
  const files = [...list]
  if (!files.length) return
  const folder = S.folder
  files.forEach((file) => queueJob({ kind: 'file', file, name: file.name || `pasted-${Date.now()}`, folder }))
  renderUploads()
  pumpUploads()
}

async function sendText(input) {
  const text = input.value.trim()
  if (!text) return
  input.value = ''
  syncSend()
  try {
    await call('POST', '/api/notes', { text, folder: S.folder })
  } catch (error) {
    if (transient(error)) {
      queueJob({ kind: 'note', text, name: text.slice(0, 60), folder: S.folder })
      holdUploads()
      toast('Saved. It sends when the PC is back', { icon: 'inbox' })
      return
    }
    console.warn('phonedrop: sending failed', error)
    toast('Sending failed', { icon: 'x' })
    input.value = text
    syncSend()
    return
  }
  const sc = feedRoot()
  if (sc) sc.scrollTop = 0
  await refresh()
}

document.addEventListener('click', (e) => {

  const a = e.target.closest('[data-act]')
  if (a) {
    if (a.dataset.act === 'toast-x') return
    if (a.closest('.toast')) dismiss(a.closest('.toast'))
    if (!a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a, e)
    return
  }
  if (e.target.closest('a')) return
  const row = e.target.closest('.cell, .card, .frow')
  if (!row) return
  const id = row.dataset.id
  if (S.selecting || (S.view === 'desk' && (e.ctrlKey || e.metaKey))) toggleSel(id)
  else if (S.view === 'desk') setCursor(id, false)
  else if (byId(id) && byId(id).kind === 'link') openLink(byId(id).url)
  else openItem(id)
})

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]')
  if (!form) return
  e.preventDefault()
  const kind = form.dataset.form
  if (kind === 'comp') { sendText(form.querySelector('input[name="t"]')); return }
  const input = form.querySelector('input[name="name"]')
  const name = input.value.trim()
  if (!name) { input.focus(); return }
  if (kind === 'new-folder') createFolder(name, S.sheet && S.sheet.ids ? S.sheet.ids : [])
  if (kind === 'new-label') {
    const sheetIds = S.sheet ? S.sheet.ids : []
    attempt(async () => {
      const label = await call('POST', '/api/labels', { name, color: S.newColor })
      if (sheetIds.length) await call('POST', '/api/label', { items: sheetIds, add: [label.id], remove: [] })
    }, 'Could not add the label').then(async (ok) => { if (ok) { input.value = ''; await refresh() } })
  }
})
$('#fileIn').addEventListener('change', (e) => { queueUploads(e.target.files); e.target.value = '' })

document.addEventListener('pointerdown', (e) => {
  suppress = false
  if (e.button > 0 || !e.target.closest('#pMain')) return
  const el = e.target.closest('[data-id]')
  if (!el || !el.matches('.cell, .card, .frow')) return
  const ctl = e.target.closest('button, a')
  if (ctl && ctl !== el) return
  const x0 = e.clientX
  const y0 = e.clientY
  lp = {
    x0, y0,
    timer: setTimeout(() => {
      lp = null
      suppress = true
      S.selecting = true
      S.sel.add(el.dataset.id)
      if (navigator.vibrate) navigator.vibrate(12)
      render()
    }, 450)
  }
  sw = el.closest('.swipe') && !S.selecting ? { el, wrap: el.closest('.swipe'), x0, y0, t0: performance.now(), dx: 0, active: false } : null
})
document.addEventListener('pointermove', (e) => {
  if (lp && Math.hypot(e.clientX - lp.x0, e.clientY - lp.y0) > 8) { clearTimeout(lp.timer); lp = null }
  if (!sw) return
  const dx = e.clientX - sw.x0
  const dy = e.clientY - sw.y0
  if (!sw.active) {
    if (dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.3) {
      sw.active = true
      sw.wrap.classList.add('swiping')
      sw.el.style.transition = 'none'
      try { sw.el.setPointerCapture(e.pointerId) } catch (error) { console.warn('phonedrop: pointer capture failed', error) }
    } else if (Math.abs(dy) > 10 || dx > 10) sw = null
    return
  }
  sw.dx = Math.min(0, dx)
  sw.el.style.transform = `translateX(${sw.dx}px)`
})
function endPointer() {
  if (lp) { clearTimeout(lp.timer); lp = null }
  if (!sw) return
  const s = sw
  sw = null
  if (!s.active) return
  suppress = true
  const v = Math.abs(s.dx) / (performance.now() - s.t0)
  s.el.style.transition = 'transform 220ms cubic-bezier(0.23,1,0.32,1)'
  if (s.dx < -110 || (v > 0.5 && s.dx < -40)) {
    s.el.style.transform = 'translateX(-105%)'
    setTimeout(() => deleteItems([s.el.dataset.id]), 200)
  } else {
    s.el.style.transform = ''
    setTimeout(() => s.wrap.classList.remove('swiping'), 220)
  }
}
document.addEventListener('pointerup', endPointer)
document.addEventListener('pointercancel', endPointer)
document.addEventListener('contextmenu', (e) => { if (e.target.closest('#pMain .cell, #pMain .card, #pMain .frow')) e.preventDefault() })

let sheetDrag = null
document.addEventListener('pointerdown', (e) => {
  const g = e.target.closest('.grab')
  if (!g || S.view !== 'phone') return
  const sheet = g.closest('.sheet')
  sheetDrag = { sheet, y: e.clientY, t: Date.now(), d: 0 }
  g.setPointerCapture(e.pointerId)
  sheet.style.transition = 'none'
})
document.addEventListener('pointermove', (e) => {
  if (!sheetDrag) return
  const d = e.clientY - sheetDrag.y
  sheetDrag.d = d > 0 ? d : d / 6
  sheetDrag.sheet.style.transform = `translateY(${sheetDrag.d}px)`
})
function endSheetDrag() {
  if (!sheetDrag) return
  const { sheet, d, t } = sheetDrag
  sheetDrag = null
  sheet.style.transition = ''
  const v = d / Math.max(1, Date.now() - t)
  if (d > 110 || v > 0.5) closeSheet(); else sheet.style.transform = ''
}
document.addEventListener('pointerup', endSheetDrag)
document.addEventListener('pointercancel', endSheetDrag)

document.addEventListener('input', (e) => {
  const t = e.target
  if (t.id === 'pIn' || t.id === 'dIn') syncSend()
  if (t.id === 'dSearch') { S.search = t.value; S.cur = ''; render() }
})
document.addEventListener('keydown', (e) => {
  const t = e.target
  const typing = t.matches('input, textarea, select')
  if (e.key === 'Escape') {
    if (S.sheet) closeSheet()
    else if (typing) { if (t.id === 'dSearch' && t.value) { t.value = ''; S.search = ''; render() } t.blur() }
    else if (S.selecting) exitSelect()
    else if (S.cur) setCursor('', false)
    else if (S.folder || S.label) { S.folder = ''; S.label = ''; render() }
    return
  }
  if (typing || e.altKey) return
  const row = t.closest ? t.closest('.card, .frow') : null
  if (row && t === row && (e.key === 'Enter' || e.key === ' ') && S.view === 'phone') {
    e.preventDefault()
    if (S.selecting) toggleSel(row.dataset.id); else openItem(row.dataset.id)
    return
  }
  if (S.sheet || S.view !== 'desk') return
  if (t.closest && t.closest('button, a') && (e.key === 'Enter' || e.key === ' ')) return
  if (e.key === '/') { e.preventDefault(); $('#dSearch').focus(); return }
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); $('#dIn').focus(); return }
  if (e.key === 'a' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); S.selecting = true; visible().forEach((it) => S.sel.add(it.id)); render(); return }
  if (e.key.startsWith('Arrow')) { e.preventDefault(); moveCursor(e.key); return }
  const cur = S.cur ? byId(S.cur) : null
  if (!cur) return
  if (e.key === 'x' || e.key === ' ') { e.preventDefault(); toggleSel(cur.id); return }
  if (e.key === 'Enter') { downloadItem(cur); return }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault()
    if (S.selecting && S.sel.size) { ACT['bulk-delete'](); return }
    if (S.armed !== cur.id) { arm(cur.id); return }
    const els = [...$('#dFeed').querySelectorAll('[data-id]')]
    const i = els.findIndex((el) => el.dataset.id === cur.id)
    const next = els[i + 1] || els[i - 1]
    deleteItems([cur.id]).then(() => { if (next) setCursor(next.dataset.id, true) })
  }
})
document.addEventListener('paste', (e) => {
  if (e.target.matches('input, textarea')) return
  const data = e.clipboardData
  if (!data) return
  if (data.files && data.files.length) { e.preventDefault(); queueUploads(data.files); return }
  const text = data.getData('text').trim()
  if (!text) return
  e.preventDefault()
  attempt(() => call('POST', '/api/notes', { text, folder: S.folder }), 'Sending failed').then((ok) => {
    if (!ok) return
    toast(`Pasted as ${parseNote(text).kind === 'link' ? 'a link' : parseNote(text).kind === 'code' ? 'a code' : 'a note'}`, { icon: 'check' })
    refresh()
  })
})

function hasFiles(e) { return e.dataTransfer && [...e.dataTransfer.types].includes('Files') }
function clearDrop(keep) { document.querySelectorAll('.nav.drop').forEach((x) => { if (x !== keep) x.classList.remove('drop') }) }
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest ? e.target.closest('#dFeed [data-id]') : null
  if (!el) return
  dragId = el.dataset.id
  e.dataTransfer.effectAllowed = 'move'
  e.dataTransfer.setData('text/plain', dragId)
})
document.addEventListener('dragend', () => { dragId = ''; clearDrop() })
window.addEventListener('dragenter', (e) => {
  if (!hasFiles(e) || S.view !== 'desk') return
  dragDepth += 1
  $('#dDrop').classList.add('on')
})
window.addEventListener('dragleave', (e) => {
  if (!hasFiles(e)) return
  dragDepth = Math.max(0, dragDepth - 1)
  if (!dragDepth) $('#dDrop').classList.remove('on')
})
window.addEventListener('dragover', (e) => {
  if (hasFiles(e)) { e.preventDefault(); return }
  const drop = e.target.closest ? e.target.closest('[data-drop]') : null
  clearDrop(drop)
  if (drop && dragId) { e.preventDefault(); drop.classList.add('drop') }
})
window.addEventListener('drop', (e) => {
  if (hasFiles(e)) {
    e.preventDefault()
    dragDepth = 0
    $('#dDrop').classList.remove('on')
    queueUploads(e.dataTransfer.files)
    return
  }
  clearDrop()
  const drop = e.target.closest ? e.target.closest('[data-drop]') : null
  if (!drop || !dragId) return
  e.preventDefault()
  const target = S.sel.has(dragId) ? [...S.sel] : [dragId]
  dragId = ''
  moveItems(target, drop.dataset.drop).then(() => { if (S.selecting) exitSelect() })
})

document.addEventListener('error', (e) => {
  const media = e.target
  if (!(media instanceof HTMLImageElement) || !media.dataset.ext) return
  const tile = document.createElement('span')
  tile.className = 'ext'
  tile.textContent = media.dataset.ext
  media.replaceWith(tile)
}, true)
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault()
  installPrompt = e
  S.installable = true
  render()
})
DESK_QUERY.addEventListener('change', (e) => setView(e.matches ? 'desk' : 'phone'))
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') scheduleRefresh() })
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch((error) => console.warn('phonedrop: service worker failed', error))
}

$('#pSend').innerHTML = ic('up')
$('#pFab').innerHTML = ic('plus')
$('#pPaste').innerHTML = `${ic('clipboard')}Paste`
$('#dUp').innerHTML = `${ic('plus', 'sm')}Upload`
$('#dSendBtn').disabled = true
setView(S.view)
try {
  const cached = localStorage.getItem('phonedrop-state')
  if (cached) applyState(JSON.parse(cached))
} catch (error) {
  console.warn('phonedrop: cached state unusable', error)
}
refresh().catch((error) => console.warn('phonedrop: initial load failed', error))
connect()
restoreOutbox()
window.addEventListener('online', resumeUploads)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeUploads() })
</script>
</body>
</html>
